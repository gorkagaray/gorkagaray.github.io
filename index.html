<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votómetro</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#1d1d1f;--muted:#6b6b70;--line:#e3e1dc;--acc:#2f5bd3;--acc-fg:#fff;--pos:#2e8b57;--neg:#c0453a;--chip:#eef1fb}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1f1f23;--fg:#ececef;--muted:#9a9aa2;--line:#33333a;--acc:#7c9cff;--acc-fg:#0d0d10;--pos:#5cc08a;--neg:#ef7a6f;--chip:#2a2f45}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:24px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
h1{font-size:1.6rem;margin:0 0 8px}h2{font-size:1.25rem;margin:0 0 12px;line-height:1.35}
.lead{font-size:1.05rem}.sub,.mini,.nota,.count{color:var(--muted)}.mini,.nota{font-size:.88rem}
.bullets{padding-left:20px}.bullets li{margin:6px 0}
.aviso{background:var(--chip);border-radius:8px;padding:8px 12px;font-size:.9rem}
.lbl{display:block;font-weight:600;margin:16px 0 6px}
select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:1rem}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 16px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);margin-top:16px}
.btn.link{border:none;background:none;color:var(--acc);padding:6px 0}
.progress{height:4px;background:var(--line);border-radius:4px;margin-bottom:12px;overflow:hidden}.progress div{height:100%;background:var(--acc);transition:width .2s}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:.82rem}
details{margin:10px 0}summary{cursor:pointer;color:var(--acc)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 10px}
.ans{padding:14px;font-size:1.05rem;font-weight:600}.ans.ghost{font-weight:400;font-size:.95rem;color:var(--muted)}
.ans.sel{outline:2px solid var(--acc)}
.peso{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--muted)}
.nav{display:flex;justify-content:space-between;margin-top:12px}
.ranking{list-style:none;padding:0;margin:16px 0}.ranking li{padding:12px 0;border-top:1px solid var(--line)}
.ranking li.top .pname{font-weight:700}.row{display:flex;justify-content:space-between;font-size:1.05rem}.score{font-variant-numeric:tabular-nums;font-weight:600}
.bar{position:relative;height:8px;background:var(--line);border-radius:4px;margin:6px 0}.bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.bar div{position:absolute;top:0;bottom:0;border-radius:4px}.bar .pos{background:var(--pos)}.bar .neg{background:var(--neg)}
.detalle{padding-left:18px;font-size:.9rem}.detalle li{margin:10px 0}.detalle li.ok strong{color:var(--pos)}.detalle li.ko strong{color:var(--neg)}
blockquote{margin:6px 0 0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}cite{display:block;font-size:.8rem}
.acciones{display:flex;flex-wrap:wrap;gap:10px}.acciones .btn{margin-top:0}
.opciones{display:flex;flex-direction:column;gap:10px;margin:18px 0 6px}.opt{text-align:left;padding:14px 16px}.opt.ghost{color:var(--muted)}.opt.sel{outline:2px solid var(--acc)}
.cruce{border-radius:10px;padding:12px 14px;margin-top:8px}.cruce.igual{background:var(--chip)}.cruce.distinto{background:color-mix(in srgb,var(--acc) 14%,var(--card));border:1px solid var(--acc)}
.votos{margin-top:6px}.votos p{margin:4px 0;font-size:.85rem;color:var(--muted)}.votos a{color:var(--acc)}.coh{font-size:.78rem;border-radius:6px;padding:1px 6px;margin-left:2px}.coh.ok{background:color-mix(in srgb,var(--pos) 18%,transparent)}.coh.ko{background:color-mix(in srgb,var(--neg) 18%,transparent)}
.ans.wide{grid-column:1/-1}
.ayuda{background:var(--chip);border-radius:10px;padding:12px 14px;margin:12px 0}.ayuda p{margin:6px 0}.ayuda ul{margin:6px 0;padding-left:18px}
.ayuda-tit{font-weight:600}.ayuda-sub{font-size:.88rem;color:var(--muted)}
.ayuda blockquote{background:var(--card);border-radius:8px;padding:8px 10px;margin:8px 0;color:var(--fg)}.ayuda blockquote.pro{border-left:3px solid var(--pos)}.ayuda blockquote.contra{border-left:3px solid var(--neg)}
.ayuda cite{color:var(--muted);margin-top:4px}
</style>
</head>

    },

 ],
 "consensos": [

 "congreso": {

  "nota": "Solo se usan votaciones revisadas en las que se votaba la misma medida que la afirmación; se excluyen las de enmiendas sueltas, las de leyes con muchas medidas mezcladas y aquellas en las que no consta qué se votaba.",

<script>
// Esta es la PLANTILLA de desarrollo: necesita data.js y engine.js a su lado.
// El archivo único para compartir lo genera scripts/build.py en salida/votometro_<año>.html
if (!window.VOTO_DATA) document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('app').innerHTML = '<section class="card"><h2>Este no es el archivo para compartir</h2><p>Es la plantilla de desarrollo y necesita los ficheros data.js y engine.js a su lado. El archivo único, que funciona solo en cualquier sitio, está en la carpeta <strong>salida</strong> (votometro_2023.html, votometro_2026.html…).</p></section>';
});
</script>
<script>
// Votómetro — motor. No envía nada a ningún servidor: todo ocurre en el navegador.
// Dos lecturas:
//  · "Por tu situación": preguntas personales → colectivos → medidas dirigidas a esos colectivos (según su intención declarada).
//  · "Por tus ideas": afirmaciones sí/no sobre los puntos en que los partidos se diferencian.
(function () {
  'use strict';
  const D = window.VOTO_DATA;
  const UMBRAL_PAR = 4; // separación mínima entre cada par de partidos, sumando situación + ideas (choque directo = 2, solo uno se pronuncia = 1)
  const $ = (s) => document.querySelector(s);
  const app = $('#app');
  const byId = Object.fromEntries(D.cuestiones.map((q) => [q.id, q]));

  const state = { circ: null, partidos: [], fase: 'sit', sitIdx: 0, sitResp: {}, preguntas: [], extra: [], idx: 0, respuestas: {} };

  // ---------- utilidades ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pos = (q, p) => (q.posiciones[p] ? q.posiciones[p].v : 0);
  const pares = (ps) => { const r = []; for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) r.push([ps[i], ps[j]]); return r; };
  const sep = (q, a, b) => { const x = pos(q, a), y = pos(q, b); if (x * y === -1) return 2; if ((x === 0) !== (y === 0)) return 1; return 0; };
  const nombre = (p) => D.partidos[p].nombre;
  const situacional = (q) => q.afecta && q.afecta.length > 0;
  // Grandes bloques de opinión: en el bloque 2 basta con una afirmación por bloque (más las necesarias para desempatar).
  const GRUPO = { territorial: 'territorio', instituciones: 'territorio', cultura_lenguas: 'territorio', memoria: 'memoria', exterior_defensa: 'exterior',
    inmigracion: 'inmigracion', seguridad_justicia: 'justicia', derechos_civiles: 'derechos', igualdad_genero: 'derechos', familia: 'derechos',
    energia_clima: 'medio', rural_animales: 'medio', educacion: 'servicios', sanidad: 'servicios' };
  const grupo = (q) => GRUPO[q.tema] || 'economia';

  function partidosDe(circ) {
    return Object.keys(D.partidos).filter((p) => { const c = D.partidos[p].circ; return c === 'todas' || c.includes(circ); });
  }

  // ---------- bloque 1: situación ----------
  function sitVisibles() {
    return D.situacion.preguntas.filter((p) => !p.si || Object.entries(p.si).every(([k, v]) => (k === 'circ' ? v.includes(state.circ) : v.includes(state.sitResp[k]))));
  }
  function perfil() {
    const perf = {};
    for (const p of sitVisibles()) {
      const i = state.sitResp[p.id];
      if (i == null || i < 0) continue;
      for (const [c, w] of Object.entries(p.opciones[i].c)) perf[c] = Math.min(2, (perf[c] || 0) + w);
    }
    return perf;
  }

  // ---------- bloque 2: ideas (selección greedy, adaptativa) ----------
  // Parte de lo que ya separa tu situación entre cada par de partidos y solo añade
  // las afirmaciones de opinión necesarias para separar lo que falte.
  function seleccionarIdeas(ps, perf) {
    const pp = pares(ps);
    const key = (a, b) => a + '|' + b;
    const cov = new Map(pp.map(([a, b]) => [key(a, b), 0]));
    // Lo que ya separa la situación: un choque directo cuenta entero; que solo uno se pronuncie cuenta poco.
    for (const q of D.cuestiones) for (const a of q.afecta || []) if (perf[a.c]) for (const [x, y] of pp) { const d = sep(q, x, y); cov.set(key(x, y), cov.get(key(x, y)) + (d === 2 ? 2 : d * 0.5) * Math.min(1, perf[a.c])); }
    const cand = D.cuestiones.filter((q) => pp.some(([x, y]) => sep(q, x, y) > 0));
    let resto = cand.filter((q) => !situacional(q));
    // Temas que no dependen de la situación personal pero en los que los partidos de tu provincia chocan de frente: al menos uno de cada.
    const temas = new Set(resto.filter((q) => pp.some(([x, y]) => sep(q, x, y) === 2)).map(grupo));
    const elegidas = [];
    for (;;) {
      let best = null, bestG = 0;
      for (const q of resto) {
        let g = 0;
        for (const [x, y] of pp) g += Math.min(sep(q, x, y), Math.max(0, UMBRAL_PAR - cov.get(key(x, y))));
        const nuevoTema = temas.has(grupo(q)) && pp.some(([x, y]) => sep(q, x, y) === 2);
        if (!g && !nuevoTema) continue;
        if (nuevoTema) g += 3;
        if (q.tipo === 'fuerte') g += 0.5;
        if (g > bestG) { bestG = g; best = q; }
      }
      if (!best) break;
      elegidas.push(best); temas.delete(grupo(best));
      for (const [x, y] of pp) cov.set(key(x, y), cov.get(key(x, y)) + sep(best, x, y));
      resto = resto.filter((q) => q !== best);
    }
    const porTema = {}; elegidas.forEach((q) => (porTema[q.tema] = porTema[q.tema] || []).push(q));
    const orden = []; const colas = Object.keys(D.temas).filter((t) => porTema[t]).map((t) => porTema[t]);
    while (colas.some((c) => c.length)) colas.forEach((c) => c.length && orden.push(c.shift()));
    const sel = new Set(orden);
    return { rapidas: orden, extra: cand.filter((q) => !sel.has(q)) };
  }

  // ---------- puntuaciones ----------
  function puntuarIdeas() {
    const ans = Object.entries(state.respuestas).filter(([, r]) => r.a !== 0);
    const totalW = ans.reduce((s, [, r]) => s + r.w, 0);
    return state.partidos.map((p) => {
      let net = 0; const coincide = [], discrepa = []; let silencio = 0;
      for (const [id, r] of ans) {
        const v = pos(byId[id], p);
        if (!v) { silencio++; continue; }
        net += r.a * v * r.w;
        (r.a === v ? coincide : discrepa).push({ q: byId[id], r });
      }
      return { p, score: totalW ? net / totalW : 0, coincide, discrepa, silencio };
    }).sort((x, y) => y.score - x.score || x.discrepa.length - y.discrepa.length);
  }

  // Para cada medida dirigida a un colectivo del perfil: partido a favor de la medida × efecto (favorece/carga) × peso.
  function puntuarSituacion() {
    const perf = perfil();
    const items = [];
    for (const q of D.cuestiones) for (const a of q.afecta || []) if (perf[a.c]) items.push({ q, a, w: perf[a.c] });
    const totalW = items.reduce((s, x) => s + x.w, 0);
    const res = state.partidos.map((p) => {
      let net = 0; const favor = [], contra = [];
      for (const it of items) {
        const v = pos(it.q, p);
        if (!v) continue;
        const s = v * it.a.efecto;
        net += s * it.w;
        (s > 0 ? favor : contra).push({ ...it, v });
      }
      return { p, score: totalW ? net / totalW : 0, favor, contra };
    }).sort((x, y) => y.score - x.score || x.contra.length - y.contra.length);
    return { res, items, perf };
  }

  // ---------- vistas ----------
  function vistaInicio() {
    app.innerHTML = `
      <section class="card intro">
        <h1>Votómetro</h1>
        <p class="lead">Unas preguntas sobre tu vida y otras sobre lo que piensas. Al final verás qué partidos encajan con cada cosa, y si coinciden o no.</p>
        <ul class="bullets">
          <li>Solo cuentan los puntos en los que los partidos <strong>se diferencian</strong>.</li>
          <li>Cada posición está respaldada por una <strong>cita literal</strong> del programa, con su página.</li>
          <li>Si un partido no dice nada sobre algo, no suma ni resta.</li>
          <li>Todas las preguntas tienen "Prefiero no responder". Tus respuestas no salen de este navegador.</li>
        </ul>
        <p class="aviso">${esc(D.meta.eleccion)}</p>
        <label class="lbl" for="circ">¿En qué provincia votas?</label>
        <select id="circ"><option value="">Elige tu circunscripción…</option>
          ${D.circunscripciones.map((c) => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}
        </select>
        <button id="empezar" class="btn primary" disabled>Empezar</button>
      </section>`;
    const sel = $('#circ'), btn = $('#empezar');
    sel.onchange = () => (btn.disabled = !sel.value);
    btn.onclick = () => empezar(sel.value);
  }

  function empezar(circ) {
    if (partidosDe(circ).length < 2) {
      app.innerHTML = `<section class="card"><h2>Todavía no</h2><p>Aún no están disponibles los programas de suficientes partidos de tu provincia para hacer la comparación. Vuelve a probar en unos días.</p><button class="btn" id="volver">Volver</button></section>`;
      $('#volver').onclick = vistaInicio; return;
    }
    Object.assign(state, { circ, partidos: partidosDe(circ), fase: 'sit', sitIdx: 0, sitResp: {}, idx: 0, respuestas: {} });
    state.preguntas = []; state.extra = [];
    siguiente();
  }

  function siguiente() {
    if (state.fase === 'sit') {
      const vis = sitVisibles();
      if (state.sitIdx < vis.length) return vistaSituacion(vis);
      state.fase = 'ideas';
      const s = seleccionarIdeas(state.partidos, perfil());
      state.preguntas = s.rapidas; state.extra = s.extra; state.idx = 0; state.respuestas = {};
      return vistaTransicion();
    }
    if (state.idx < state.preguntas.length) return vistaPregunta();
    vistaResultado();
  }

  function cabecera(bloque, i, n, total) {
    return `<div class="progress"><div style="width:${(i / total) * 100}%"></div></div>
      <div class="meta"><span class="chip">${bloque}</span><span class="count">${i + 1} / ${n}</span></div>`;
  }

  function vistaSituacion(vis) {
    const p = vis[state.sitIdx], sel = state.sitResp[p.id];
    app.innerHTML = `
      <section class="card pregunta">
        ${cabecera('1 · Tu situación', state.sitIdx, vis.length, vis.length)}
        <h2>${esc(p.texto)}</h2>
        <div class="opciones">
          ${p.opciones.map((o, i) => `<button class="btn opt ${sel === i ? 'sel' : ''}" data-i="${i}">${esc(o.t)}</button>`).join('')}
          <button class="btn opt ghost ${sel === -1 ? 'sel' : ''}" data-i="-1">Prefiero no responder</button>
        </div>
        <div class="nav"><button class="btn link" id="atras" ${state.sitIdx === 0 ? 'disabled' : ''}>← Anterior</button></div>
      </section>`;
    app.querySelectorAll('.opt').forEach((b) => (b.onclick = () => {
      state.sitResp[p.id] = +b.dataset.i;
      // si cambia una respuesta de la que dependen otras, las dependientes se recalculan solas (sitVisibles)
      state.sitIdx++; siguiente();
    }));
    $('#atras').onclick = () => { state.sitIdx--; siguiente(); };
  }

  function vistaTransicion() {
    const n = state.preguntas.length;
    app.innerHTML = `
      <section class="card">
        <h2>${n ? 'Unas pocas de opinión' : 'Listo'}</h2>
        ${n ? `<p>Tu situación ya separa bastante a los partidos. Para distinguir los que aún quedan parecidos, faltan <strong>${n}</strong> afirmaciones sobre temas que no dependen de tu situación personal. Responde Sí o No según lo que pienses. Si no tienes una opinión formada, pulsa "No sé" y te enseñaremos qué dicen los programas a favor y en contra; si el tema no te importa, "Me da igual". Mientras no elijas Sí o No, no cuenta para el resultado.</p>`
            : '<p>Con tu situación ya se distingue a todos los partidos de tu provincia.</p>'}
        ${n ? '<button class="btn primary" id="go">Continuar</button>' : ''}
        <button class="btn ${n ? '' : 'primary'}" id="ya" style="margin-top:16px">Ver resultado${n ? ' sin ellas' : ''}</button>
        <div class="nav"><button class="btn link" id="atras">← Volver a tu situación</button></div>
      </section>`;
    if ($('#go')) $('#go').onclick = siguiente;
    $('#ya').onclick = vistaResultado;
    $('#atras').onclick = () => { state.fase = 'sit'; state.sitIdx = sitVisibles().length - 1; siguiente(); };
  }

  // ---------- ayudas al responder ----------
  const NOMBRES_PARTIDO = /\b(PSOE|PP|Partido Popular|Vox|VOX|Sumar|SUMAR|ERC|Esquerra|Junts|PNV|EAJ|Bildu|BNG|Bloque|UPN|socialistas?|populares)\b/;
  const EN_CASTELLANO = ['psoe', 'pp', 'vox', 'sumar', 'pnv', 'upn', 'bildu'];
  // Una cita representativa de cada lado, sin el nombre del partido (para decidir por el contenido, no por la sigla).
  function citaAnonima(q, v) {
    const c = Object.entries(q.posiciones).filter(([, x]) => x.v === v && !NOMBRES_PARTIDO.test(x.cita));
    if (!c.length) return null;
    const rango = ([p]) => (state.partidos.includes(p) ? 0 : 2) + (EN_CASTELLANO.includes(p) ? 0 : 1);
    c.sort((x, y) => rango(x) - rango(y) || y[1].cita.length - x[1].cita.length);
    return c[0][1].cita;
  }
  // Medidas de esta cuestión dirigidas a algún grupo en el que estás, según tu situación.
  function teAfecta(q) {
    const perf = perfil();
    return (q.afecta || []).filter((a) => perf[a.c]).map((a) => ({ ...a, grupo: D.situacion.colectivos[a.c] }));
  }

  function vistaPregunta(modo) {
    const q = state.preguntas[state.idx];
    const N = state.preguntas.length, r = state.respuestas[q.id] || { a: null, w: 1 };
    const guardar = (a, extra) => {
      state.respuestas[q.id] = { a, w: $('#peso') && $('#peso').checked ? 2 : (r.w || 1), ...extra };
      state.idx++; siguiente();
    };
    let cuerpo;
    if (modo === 'nose') {
      const si = citaAnonima(q, 1), no = citaAnonima(q, -1);
      cuerpo = `
        <div class="ayuda">
          <p class="ayuda-tit">Para ayudarte a decidir</p>
          <p>${esc(q.explicacion)}</p>
          <p class="ayuda-sub">Lo que dicen los programas (sin decir de quién, para que decidas por el contenido):</p>
          ${si ? `<blockquote class="pro">«${esc(si)}»<cite>Un programa que lo defiende</cite></blockquote>` : '<p class="mini">Ningún programa lo defiende expresamente.</p>'}
          ${no ? `<blockquote class="contra">«${esc(no)}»<cite>Un programa que lo rechaza</cite></blockquote>` : '<p class="mini">Ningún programa lo rechaza expresamente.</p>'}
        </div>
        <div class="answers">
          <button class="btn ans" data-r="1">Sí</button>
          <button class="btn ans" data-r="-1">No</button>
          <button class="btn ans ghost wide" data-r="ns">Sigo sin saberlo</button>
        </div>`;
    } else if (modo === 'igual') {
      const af = teAfecta(q);
      cuerpo = `
        <div class="ayuda aviso-afecta">
          <p class="ayuda-tit">Ojo: esta medida va dirigida a personas en tu situación</p>
          <ul>${af.map((a) => `<li><strong>${esc(a.grupo)}:</strong> ${esc(a.nota)} (${a.efecto === 1 ? 'pensada para favorecerte' : 'te supondría una carga'}).</li>`).join('')}</ul>
          <p>Aunque te dé igual, cuenta en tu lectura <em>por tu situación</em>. Si quieres, puedes darnos tu opinión.</p>
        </div>
        <div class="answers">
          <button class="btn ans" data-r="1">Sí</button>
          <button class="btn ans" data-r="-1">No</button>
          <button class="btn ans ghost wide" data-r="igual">Me sigue dando igual</button>
        </div>`;
    } else {
      cuerpo = `
        <details><summary>¿Qué significa?</summary><p>${esc(q.explicacion)}</p></details>
        <div class="answers">
          <button class="btn ans ${r.a === 1 ? 'sel' : ''}" data-r="1">Sí</button>
          <button class="btn ans ${r.a === -1 ? 'sel' : ''}" data-r="-1">No</button>
          <button class="btn ans ghost ${r.a === 0 && !r.ns ? 'sel' : ''}" data-r="igual?">Me da igual</button>
          <button class="btn ans ghost ${r.ns ? 'sel' : ''}" data-r="nose?">No sé / no contesto</button>
        </div>`;
    }
    app.innerHTML = `
      <section class="card pregunta">
        ${cabecera('2 · Tu opinión · ' + esc(D.temas[q.tema] || q.tema), state.idx, N, N)}
        <h2>${esc(q.afirmacion)}</h2>
        ${cuerpo}
        <label class="peso"><input type="checkbox" id="peso" ${r.w === 2 ? 'checked' : ''}> Es especialmente importante para mí</label>
        <div class="nav">
          <button class="btn link" id="atras">← ${modo ? 'Volver a la pregunta' : 'Anterior'}</button>
          <button class="btn link" id="salir">Ver resultado ahora</button>
        </div>
      </section>`;
    app.querySelectorAll('.ans').forEach((b) => (b.onclick = () => {
      const k = b.dataset.r;
      if (k === '1' || k === '-1') return guardar(+k, { ns: false, ayuda: modo === 'nose' });
      if (k === 'nose?') return vistaPregunta('nose');
      if (k === 'ns') return guardar(0, { ns: true });
      if (k === 'igual?') return teAfecta(q).length ? vistaPregunta('igual') : guardar(0, { ns: false });
      if (k === 'igual') return guardar(0, { ns: false, avisado: true });
    }));
    $('#atras').onclick = () => {
      if (modo) return vistaPregunta();
      if (state.idx === 0) { vistaTransicion(); } else { state.idx--; siguiente(); }
    };
    $('#salir').onclick = vistaResultado;
  }

  function ranking(res, detalleFn, vacio) {
    if (vacio) return `<p class="mini">${vacio}</p>`;
    return `<ol class="ranking">${res.map((x, i) => `
      <li class="${i === 0 ? 'top' : ''}">
        <div class="row"><span class="pname">${esc(nombre(x.p))}</span><span class="score">${x.sinDatos ? '—' : Math.round(x.score * 100)}</span></div>
        <div class="bar"><div class="${x.score < 0 ? 'neg' : 'pos'}" style="${x.score < 0 ? 'right:50%' : 'left:50%'};width:${Math.abs(x.score) * 50}%"></div></div>
        ${detalleFn(x)}
      </li>`).join('')}</ol>`;
  }

  function vistaResultado() {
    const ideas = puntuarIdeas();
    const sit = puntuarSituacion();
    const vot = D.congreso ? puntuarVotos() : null;
    const nIdeas = Object.values(state.respuestas).filter((r) => r.a !== 0).length;
    const nNs = Object.values(state.respuestas).filter((r) => r.ns).length;
    const nIgual = Object.values(state.respuestas).filter((r) => r.a === 0 && !r.ns).length;
    const nAyuda = Object.values(state.respuestas).filter((r) => r.ayuda).length;
    const igualAfecta = Object.entries(state.respuestas).filter(([, r]) => r.a === 0 && !r.ns)
      .map(([id]) => ({ q: byId[id], af: teAfecta(byId[id]) })).filter((x) => x.q && x.af.length);
    const circ = D.circunscripciones.find((c) => c.id === state.circ).nombre;
    const aviso = D.meta.avisos && D.meta.avisos[state.circ];
    const pendCirc = (D.meta.pendientes || []).filter((x) => x.circ === 'todas' || x.circ.includes(state.circ)).map((x) => x.nombre);
    const pend = state.preguntas.length - state.idx;
    const topI = nIdeas ? ideas[0].p : null;
    const topS = sit.items.length && sit.res[0].score > 0 ? sit.res[0].p : null;
    const perfTxt = Object.keys(sit.perf).map((c) => D.situacion.colectivos[c]).filter(Boolean);

    let cruce = '';
    if (topI && topS) {
      cruce = topI === topS
        ? `<div class="cruce igual"><strong>${esc(nombre(topI))}</strong> encabeza las dos lecturas: es el más cercano a lo que opinas y también el que más propuestas dirige a gente en tu situación.</div>`
        : `<div class="cruce distinto">Por tu opinión, el más cercano es <strong>${esc(nombre(topI))}</strong>. Pero el que más propuestas dirige a gente en tu situación es <strong>${esc(nombre(topS))}</strong>. Mira el detalle de cada uno antes de decidir.</div>`;
    }

    app.innerHTML = `
      <section class="card">
        <h1>Tu resultado</h1>
        <p class="sub">${esc(circ)}</p>
        ${aviso ? `<p class="aviso">${esc(aviso)}</p>` : ''}
        ${pendCirc.length ? `<p class="aviso">Aún no está disponible el programa de ${esc(pendCirc.join(', '))}, así que no aparece${pendCirc.length > 1 ? 'n' : ''} en el resultado.</p>` : ''}
        ${cruce}
      </section>
      <section class="card">
        <h2>Por tu situación</h2>
        ${perfTxt.length ? `<p class="mini">Según tus respuestas: ${perfTxt.map(esc).join(' · ').toLowerCase()}.</p>` : ''}
        ${ranking(sit.res, (x) => `
          <p class="mini">${x.favor.length} medidas pensadas para gente como tú · ${x.contra.length} en sentido contrario</p>
          <details><summary>Ver qué medidas</summary>${detalleSit(x)}</details>`,
          !sit.items.length ? 'Con tus respuestas no hay medidas en los programas dirigidas específicamente a tu situación. Cuenta solo la lectura por ideas.' : '')}
        <p class="nota">Suma cuando un partido defiende una medida pensada para favorecer a personas en tu situación, o rechaza una que te impondría una carga. Resta en el caso contrario. Mide la <em>intención declarada</em> de cada medida, no si funcionaría: sobre eso los partidos discrepan.</p>
      </section>
      <section class="card">
        <h2>Por tu opinión</h2>
        <p class="mini">${nIdeas} respuestas con opinión${nNs ? ` · ${nNs} «no sé»` : ''}${nIgual ? ` · ${nIgual} «me da igual»` : ''}${nAyuda ? ` · ${nAyuda} decidida${nAyuda > 1 ? 's' : ''} tras ver las citas` : ''}</p>
        ${nNs >= 3 ? `<p class="mini">Has dejado ${nNs} sin opinión. Si quieres, vuelve a ellas con calma: cada afirmación tiene un «¿Qué significa?» que explica de qué va.</p>` : ''}
        ${ranking(ideas, (x) => `
          <p class="mini">Coincide en ${x.coincide.length} · discrepa en ${x.discrepa.length} · no se pronuncia en ${x.silencio}</p>
          <details><summary>Ver por qué</summary>${detalleIdeas(x)}</details>`,
          !nIdeas ? 'No has respondido ninguna afirmación con Sí o No.' : '')}
        <p class="nota">De −100 (defiende justo lo contrario que tú en todo) a +100 (coincide en todo). Las respuestas marcadas como importantes cuentan doble.</p>
        <div class="acciones">
          ${pend > 0 ? `<button class="btn primary" id="seguir">Seguir respondiendo (${pend} pendientes)</button>` : ''}
          ${pend <= 0 && state.extra.length ? `<button class="btn primary" id="afinar">Afinar con ${state.extra.length} afirmaciones más</button>` : ''}
          <button class="btn" id="reiniciar">Empezar de nuevo</button>
        </div>
      </section>
      ${igualAfecta.length ? `<section class="card">
        <h2>Te da igual, pero te afecta</h2>
        <p class="mini">Medidas que marcaste con «me da igual» y que van dirigidas a personas en tu situación. No cambian tu lectura por opinión; ya cuentan en la de tu situación.</p>
        <ul class="detalle">${igualAfecta.map(({ q, af }) => {
          const a = state.partidos.filter((p) => pos(q, p) === 1).map(nombre), c = state.partidos.filter((p) => pos(q, p) === -1).map(nombre);
          return `<li><strong>${esc(q.afirmacion)}</strong>
            <em>(${af.map((x) => `${esc(x.grupo.toLowerCase())}: ${esc(x.nota)}`).join('; ')})</em>
            <p class="mini">La proponen: ${esc(a.join(', ') || 'ninguno de tu provincia')} · La rechazan: ${esc(c.join(', ') || 'ninguno de tu provincia')}</p></li>`;
        }).join('')}</ul>
      </section>` : ''}
      ${vot ? `<section class="card">
        <h2>Lo que han votado</h2>
        <p class="mini">${esc(D.congreso.titulo)} · ${vot.n} de tus temas tienen votaciones vinculadas</p>
        ${ranking(vot.res, (x) => x.sinDatos ? '<p class="mini">Sin votaciones vinculadas a tus temas.</p>' : `
          <p class="mini">Con votaciones en ${x.items.length} de tus temas${x.total ? ` · en general votó en línea con su programa en ${x.enLinea} de ${x.total} temas` : ''}</p>
          <details><summary>Ver votaciones</summary>${detalleVotos(x)}</details>`,
          !vot.n ? 'Ninguno de los temas que has respondido tiene votaciones del Congreso vinculadas.' : '')}
        <p class="nota">No se suma a las otras puntuaciones: compara lo que quieres (por tu opinión y tu situación) con lo que cada partido votó de verdad. ${esc(D.congreso.nota)}</p>
      </section>` : ''}
      <section class="card">
        <h2>Cómo funciona</h2>
        <p>Las afirmaciones salen de las propuestas en las que los programas se contradicen o en las que solo algunos partidos se comprometen. Tus respuestas sobre tu situación no se convierten en opiniones: solo sirven para saber a qué medidas prestar atención en tu caso.</p>
        <details><summary>Puntos en los que todos coinciden (no influyen)</summary><ul>${D.consensos.map((c) => `<li>${esc(c)}</li>`).join('')}</ul></details>
      </section>`;
    if ($('#seguir')) $('#seguir').onclick = siguiente;
    if ($('#afinar')) $('#afinar').onclick = () => { state.preguntas = state.preguntas.concat(state.extra); state.extra = []; siguiente(); };
    $('#reiniciar').onclick = vistaInicio;
  }

  // ---------- votaciones del Congreso ----------
  const VALOR = { si: 1, no: -1, abst: 0 };
  const TXT = { si: 'Sí', no: 'No', abst: 'abstención' };
  const fechaTxt = (f) => f.split('-').reverse().join('/');
  // Postura del partido según sus votos en una cuestión: media de (voto × sentido). null si no votó nada vinculado.
  function posturaVotos(q, p) {
    const vs = (q.votaciones || []).filter((v) => v.votos[p]);
    if (!vs.length) return null;
    return vs.reduce((s, v) => s + VALOR[v.votos[p]] * v.sentido, 0) / vs.length;
  }
  function lineasVotos(q, p) {
    const vs = (q.votaciones || []).filter((v) => v.votos[p]);
    if (!vs.length) return '';
    const prog = pos(q, p);
    return `<div class="votos">${vs.map((v) => {
      const st = VALOR[v.votos[p]] * v.sentido;
      const coh = !prog || !st ? '' : st === prog ? '<span class="coh ok">en línea con su programa</span>' : '<span class="coh ko">contradice su programa</span>';
      return `<p>En el Congreso (${fechaTxt(v.fecha)}) votó <strong>${TXT[v.votos[p]]}</strong>: ${esc(v.resumen.replace(/\.$/, ''))}. ${coh} <a href="${v.url}" target="_blank" rel="noopener">ver votación</a></p>`;
    }).join('')}</div>`;
  }
  // Cuánto quieres tú cada cuestión: respuestas de opinión (Sí/No × peso) y medidas que te afectan (efecto × peso).
  function deseos() {
    const d = {};
    for (const [id, r] of Object.entries(state.respuestas)) if (r.a) d[id] = (d[id] || 0) + r.a * r.w;
    const perf = perfil();
    for (const q of D.cuestiones) for (const a of q.afecta || []) if (perf[a.c]) d[q.id] = (d[q.id] || 0) + a.efecto * perf[a.c];
    return d;
  }
  function puntuarVotos() {
    const d = deseos();
    const conVotos = D.cuestiones.filter((q) => d[q.id] && (q.votaciones || []).length);
    const res = state.partidos.map((p) => {
      let num = 0, den = 0; const items = [];
      for (const q of conVotos) {
        const st = posturaVotos(q, p);
        if (st === null) continue;
        num += d[q.id] * st; den += Math.abs(d[q.id]);
        items.push({ q, st, quieres: Math.sign(d[q.id]) });
      }
      // coherencia programa-votos en todas las cuestiones con ambas cosas
      let enLinea = 0, total = 0;
      for (const q of D.cuestiones) { const st = posturaVotos(q, p), pr = pos(q, p); if (st && pr) { total++; if (st * pr > 0) enLinea++; } }
      return { p, score: den ? num / den : 0, items, enLinea, total, sinDatos: !den };
    }).sort((x, y) => (x.sinDatos - y.sinDatos) || y.score - x.score);
    return { res, n: conVotos.length };
  }
  function detalleVotos(x) {
    if (!x.items.length) return '<p class="mini">No hay votaciones suyas vinculadas a tus temas (o no tenía diputados).</p>';
    return `<ul class="detalle">${x.items.map((o) => {
      const ok = o.st * o.quieres > 0, neutro = !o.st;
      return `<li class="${neutro ? '' : ok ? 'ok' : 'ko'}"><strong>${neutro ? 'Se abstuvo' : ok ? 'Votó como quieres' : 'Votó en contra de lo que quieres'}:</strong> ${esc(o.q.afirmacion)}${lineasVotos(o.q, x.p)}</li>`;
    }).join('')}</ul>`;
  }

  const cita = (q, p) => { const c = q.posiciones[p]; return `<blockquote>«${esc(c.cita)}» <cite>${esc(D.partidos[p].fuente)}, pág. ${c.pag}</cite></blockquote>`; };

  function detalleSit(x) {
    if (!x.favor.length && !x.contra.length) return '<p class="mini">Este partido no se pronuncia sobre ninguna medida dirigida a tu situación.</p>';
    const item = (o, ok) => `<li class="${ok ? 'ok' : 'ko'}"><strong>${o.v === 1 ? 'Propone' : 'Rechaza'}:</strong> ${esc(o.q.afirmacion)}
      <em>(${esc(o.a.nota)}; ${o.a.efecto === 1 ? 'pensada para favorecerte' : 'te supondría una carga'})</em>${cita(o.q, x.p)}${lineasVotos(o.q, x.p)}</li>`;
    return `<ul class="detalle">${x.favor.map((o) => item(o, true)).join('')}${x.contra.map((o) => item(o, false)).join('')}</ul>`;
  }

  function detalleIdeas(x) {
    if (!x.coincide.length && !x.discrepa.length) return '<p class="mini">Este partido no se pronuncia sobre ninguna de tus respuestas.</p>';
    const item = (o, ok) => `<li class="${ok ? 'ok' : 'ko'}"><strong>${ok ? 'Coincide' : 'Discrepa'}:</strong> ${esc(o.q.afirmacion)}
      <em>(tú: ${o.r.a === 1 ? 'Sí' : 'No'}${o.r.w === 2 ? ', importante' : ''}; partido: ${pos(o.q, x.p) === 1 ? 'a favor' : 'en contra'})</em>${cita(o.q, x.p)}${lineasVotos(o.q, x.p)}</li>`;
    return `<ul class="detalle">${x.coincide.map((o) => item(o, true)).join('')}${x.discrepa.map((o) => item(o, false)).join('')}</ul>`;
  }

  window.VOTO_ENGINE = { puntuarVotos, posturaVotos, seleccionarIdeas, partidosDe, puntuarIdeas, puntuarSituacion, perfil, sitVisibles, state };
  vistaInicio();
})();
</script>
